<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Design Notes — System Design Notes</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/highlight-theme.css">
<script src="assets/sidebar.js" defer></script>
<script src="assets/highlight.min.js" defer></script>
<script src="assets/mermaid.min.js" defer></script>
<script defer>
document.addEventListener('DOMContentLoaded', function () {
  hljs.configure({ cssSelector: 'pre code[class^="language-"]' });
  hljs.highlightAll();
  mermaid.initialize({
    startOnLoad: true,
    theme: 'base',
    themeVariables: {
      primaryColor: '#ece9fd',
      primaryBorderColor: '#5b3df0',
      primaryTextColor: '#232037',
      lineColor: '#5b3df0',
      fontFamily: 'ui-sans-serif, -apple-system, sans-serif',
      fontSize: '13px'
    }
  });
});
</script>
</head>
<body>
<div class="layout">
<nav class="sidebar" id="sidebar"></nav>
<main><p class="empty-state">Select a note from the sidebar to begin.</p></main>
</div>
</body>
</html>
