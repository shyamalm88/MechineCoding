<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes Hub</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #0d0c14;
  }

  nav {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.75rem 1rem;
    background: linear-gradient(180deg, rgba(30, 27, 48, 0.92), rgba(20, 18, 31, 0.92));
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(139, 108, 245, 0.25);
    box-shadow: 0 1px 24px rgba(59, 42, 163, 0.25);
    flex-shrink: 0;
    position: sticky;
    top: 0;
    z-index: 1;
  }

  nav button {
    appearance: none;
    border: 1px solid transparent;
    background: transparent;
    color: #b0abcf;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 0.55rem 1.1rem;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  nav button:hover { background: rgba(139, 108, 245, 0.12); color: #e4e1f7; }
  nav button.active {
    background: linear-gradient(135deg, rgba(91, 61, 240, 0.55), rgba(37, 99, 235, 0.55));
    border-color: rgba(159, 133, 255, 0.6);
    color: #ffffff;
    box-shadow: 0 0 0 1px rgba(159, 133, 255, 0.25), 0 4px 18px rgba(76, 60, 220, 0.45);
  }

  main {
    flex: 1;
    min-height: 0;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    background: #0d0c14;
  }
</style>
</head>
<body>
<nav>
  <button type="button" data-src="theory-notes/index.html" class="active">Theory Notes</button>
  <button type="button" data-src="system-design-notes/index.html">System Design Notes</button>
  <button type="button" data-src="grokking-system-design/index.html">Grokking System Design</button>
  <button type="button" data-src="javanotes-notes/index.html">Java Notes</button>
  <button type="button" data-src="frontend-interview-hub/index.html">Frontend Interview Hub</button>
</nav>
<main>
  <iframe id="content" title="Selected site"></iframe>
</main>
<script>
  var buttons = document.querySelectorAll('nav button');
  var frame = document.getElementById('content');

  function siteRoot(path) {
    return path.split('/')[0] + '/';
  }

  function activateButton(path) {
    var root = siteRoot(path);
    buttons.forEach(function (b) {
      b.classList.toggle('active', siteRoot(b.dataset.src) === root);
    });
  }

  function relativeToBase(href) {
    var path = location.pathname.slice(0, location.pathname.lastIndexOf('/') + 1);
    var base = location.origin + path;
    return href.indexOf(base) === 0 ? href.slice(base.length) : href;
  }

  // remember the iframe's current page in the URL hash so a refresh
  // restores the same site + note instead of resetting to the default
  frame.addEventListener('load', function () {
    var path = relativeToBase(frame.contentWindow.location.href);
    if (path) {
      history.replaceState(null, '', '#' + path);
      activateButton(path);
    }
  });

  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      frame.src = btn.dataset.src;
    });
  });

  var restored = decodeURIComponent(location.hash.slice(1));
  frame.src = restored || buttons[0].dataset.src;
</script>
</body>
</html>
