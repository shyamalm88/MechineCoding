<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes Hub</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #fbfbfe;
  }

  nav {
    display: flex;
    gap: 0.25rem;
    padding: 0.75rem 1rem;
    background: #f8f7fc;
    border-bottom: 1px solid #ece9f7;
    flex-shrink: 0;
  }

  nav button {
    appearance: none;
    border: none;
    background: transparent;
    color: #504b6b;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 0.55rem 1rem;
    border-radius: 8px;
    cursor: pointer;
  }
  nav button:hover { background: #f1effc; }
  nav button.active {
    background: #ece9fd;
    color: #5b3df0;
  }

  main {
    flex: 1;
    min-height: 0;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
</style>
</head>
<body>
<nav>
  <button type="button" data-src="theory-notes/index.html" class="active">Theory Notes</button>
  <button type="button" data-src="system-design-notes/index.html">System Design Notes</button>
  <button type="button" data-src="grokking-system-design/index.html">Grokking System Design</button>
</nav>
<main>
  <iframe id="content" src="theory-notes/index.html" title="Selected site"></iframe>
</main>
<script>
  var buttons = document.querySelectorAll('nav button');
  var frame = document.getElementById('content');
  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      buttons.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      frame.src = btn.dataset.src;
    });
  });
</script>
</body>
</html>
